name: Release to GPR

on:
  push:
    tags: ["*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node LTS ✨
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies 📦️
        run: yarn install --immutable

      - name: Test 🧪
        run: yarn test

      - name: Build 🔨
        run: yarn build
        
      - name: Publish 🔼
        uses: simenandre/publish-with-yarn@v2.0.0
        with:
          npm-auth-token: ${{secrets.GITHUB_TOKEN}}
